[workspace]
resolver = "2"
members = ["crates/*", "apps/margin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.dependencies]
margin-proto = { path = "crates/margin-proto" }
margin-testutil = { path = "crates/margin-testutil" }
margin-theme = { path = "crates/margin-theme" }
margin-code = { path = "crates/margin-code" }
margin-engine = { path = "crates/margin-engine" }
margin-editor = { path = "crates/margin-editor" }
margin-gui = { path = "crates/margin-gui" }
margin-shot = { path = "crates/margin-shot" }

# Third-party. Adding one: docs/deps.md first (supply-chain checks, 7-day cooldown).
# Versions: see docs/deps.md (vetted 2026-11-20).
regex = "1"
memchr = "2"
rayon = "1"
# Already in the lock (png, via eframe). Used by the screenshot PNG encoder only.
flate2 = "1"
# No webview. No `links` (the app opens no URL), no accesskit, no persistence.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "x11", "wayland"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
# Headless rendering for GUI tests and screenshots (same versions eframe pulls in).
egui-wgpu = { version = "0.37", default-features = false }
wgpu = "30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# stdout is the IPC channel of the gui and worker roles.
print_stdout = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"

# Dependencies: optimised, no debuginfo.
[profile.dev.package."*"]
opt-level = 2
debug = false
